    <!-- <label>{{codFoto}}</label> -->

<div class="container-grafico-propaganda" *ngIf="codFoto > 0">

    <div class="row">
        <ng-container *ngFor="let n of fotos">
            <div 
                *ngIf="imagensValidas[n]"
                class="card-propaganda" 
                (click)="openPopup(n)">
                <img 
                    class="img-propaganda" 
                    [src]="montaImagePropaganda(n)"
                    (error)="onImageError(n)">
            </div>
        </ng-container>
    </div>

    <div class="card-textos-propaganda">
        <div *ngFor="let item of graficoComunicacaoQuadroResumo" class="texto-propaganda">
            {{item.Texto}}
        </div>
    </div>
</div>

<div class="popup-wrapper" id="popupWrapper">
    <div class="popup-content">
        <span class="close-btn" (click)="closePopup()">
            <img src="assets/icones/btn-close-preview.png">
        </span>
        <img class="image-view" src="{{itemSelected}}">
    </div>
</div>
